[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Quantum-inspired local agentic paper-trading research lab (Project II)"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "requests>=2.32",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
# Optional simulated-quantum comparison path. Kept out of the base install so
# the core four-method benchmark runs on a machine without Qiskit. The code uses
# only `qiskit.QuantumCircuit` and `qiskit.quantum_info.Statevector`.
quantum = ["qiskit>=1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "slow: benchmark-scale runs, deselect with '-m \"not slow\"'",
    "needs_qiskit: requires the optional quantum extra",
    "needs_broker: requires Alpaca paper credentials",
]
